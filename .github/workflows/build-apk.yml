name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check repo files
        run: |
          ls -la
          test -f index.html || { echo "::error::index.html must be in the repo root (same level as the .github folder)"; exit 1; }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web assets (bundle Three.js so the APK works offline)
        run: |
          mkdir -p www
          cp index.html www/index.html
          if curl -fsSL "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" -o www/three.min.js; then
            sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js#three.min.js#' www/index.html
            echo "Three.js bundled locally."
          else
            echo "Could not download Three.js; the app will load it from the CDN instead."
            rm -f www/three.min.js
          fi

      - name: Create Capacitor Android project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Hollow Halls" com.hollowhalls.game --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Patch manifest and theme
        run: |
          python3 - <<'PY'
          import re
          mf = 'android/app/src/main/AndroidManifest.xml'
          s = open(mf, encoding='utf-8').read()
          s = s.replace('<activity', '<activity android:screenOrientation="sensorLandscape"', 1)
          perms = [
              '<uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />',
              '<uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />',
              '<uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />',
              '<uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />',
              '<uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />',
              '<uses-feature android:name="android.hardware.bluetooth" android:required="false" />',
          ]
          s = s.replace('<application', '\n    '.join(perms) + '\n\n    <application', 1)
          open(mf, 'w', encoding='utf-8').write(s)

          st = 'android/app/src/main/res/values/styles.xml'
          t = open(st, encoding='utf-8').read()
          t = re.sub(r'(<style name="AppTheme\.NoActionBar"[^>]*>)',
                     r'\1\n        <item name="android:windowFullscreen">true</item>', t, count=1)
          open(st, 'w', encoding='utf-8').write(t)
          PY
          cat android/app/src/main/AndroidManifest.xml

      - name: Add native Bluetooth plugin (multi-player)
        run: |
          DIR=android/app/src/main/java/com/hollowhalls/game
          ls "$DIR"
          cat > "$DIR/MainActivity.java" <<'EOF'
          package com.hollowhalls.game;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(BtPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF
          cat > "$DIR/BtPlugin.java" <<'EOF'
          package com.hollowhalls.game;

          import android.annotation.SuppressLint;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothClass;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothServerSocket;
          import android.bluetooth.BluetoothSocket;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.os.Build;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.Map;
          import java.util.UUID;
          import java.util.concurrent.ConcurrentHashMap;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          @SuppressLint("MissingPermission")
          @CapacitorPlugin(name = "Bt", permissions = {
              @Permission(alias = "bt12", strings = {
                  "android.permission.BLUETOOTH_SCAN",
                  "android.permission.BLUETOOTH_CONNECT",
                  "android.permission.BLUETOOTH_ADVERTISE"
              }),
              @Permission(alias = "loc", strings = { "android.permission.ACCESS_FINE_LOCATION" })
          })
          public class BtPlugin extends Plugin {
              private static final UUID APP_UUID = UUID.fromString("6f3c5a1e-8b24-4d7a-9c10-2e5f0a1b7d93");

              private static class Conn {
                  int id;
                  BluetoothSocket sock;
                  OutputStream out;
              }

              private BluetoothAdapter adapter;
              private BluetoothServerSocket server;
              private BroadcastReceiver receiver;
              private final Map<Integer, Conn> conns = new ConcurrentHashMap<>();
              private int nextId = 1;
              private final ExecutorService writer = Executors.newSingleThreadExecutor();

              private String alias() { return Build.VERSION.SDK_INT >= 31 ? "bt12" : "loc"; }

              @PluginMethod
              public void requestAccess(PluginCall call) {
                  if (getPermissionState(alias()) == PermissionState.GRANTED) finishAccess(call);
                  else requestPermissionForAlias(alias(), call, "accessCb");
              }

              @PermissionCallback
              private void accessCb(PluginCall call) {
                  if (getPermissionState(alias()) == PermissionState.GRANTED) finishAccess(call);
                  else call.reject("Bluetooth permission denied");
              }

              private void finishAccess(PluginCall call) {
                  adapter = BluetoothAdapter.getDefaultAdapter();
                  if (adapter == null) { call.reject("No Bluetooth on this device"); return; }
                  if (!adapter.isEnabled()) {
                      getActivity().startActivity(new Intent(BluetoothAdapter.ACTION_REQUEST_ENABLE));
                  }
                  call.resolve();
              }

              @PluginMethod
              public void isEnabled(PluginCall call) {
                  BluetoothAdapter a = BluetoothAdapter.getDefaultAdapter();
                  JSObject o = new JSObject();
                  o.put("enabled", a != null && a.isEnabled());
                  call.resolve(o);
              }

              // Host: accept up to "max" guests on one server socket (star topology)
              @PluginMethod
              public void host(PluginCall call) {
                  final int max = call.getInt("max", 3);
                  try {
                      if (adapter == null) adapter = BluetoothAdapter.getDefaultAdapter();
                      closeServer();
                      final BluetoothServerSocket srv = adapter.listenUsingInsecureRfcommWithServiceRecord("HollowHalls", APP_UUID);
                      server = srv;
                      Intent d = new Intent(BluetoothAdapter.ACTION_REQUEST_DISCOVERABLE);
                      d.putExtra(BluetoothAdapter.EXTRA_DISCOVERABLE_DURATION, 300);
                      getActivity().startActivity(d);
                      new Thread(() -> {
                          try {
                              while (conns.size() < max) {
                                  BluetoothSocket c = srv.accept();
                                  attach(c, nextId++);
                              }
                          } catch (IOException ignored) {}
                          try { srv.close(); } catch (IOException ignored) {}
                      }).start();
                      call.resolve();
                  } catch (Exception e) {
                      call.reject("host failed: " + e.getMessage());
                  }
              }

              @PluginMethod
              public void stopHost(PluginCall call) { closeServer(); call.resolve(); }

              @PluginMethod
              public void discover(PluginCall call) {
                  try {
                      if (adapter == null) adapter = BluetoothAdapter.getDefaultAdapter();
                      stopReceiver();
                      for (BluetoothDevice d : adapter.getBondedDevices()) emitFound(d, true, null, null);
                      receiver = new BroadcastReceiver() {
                          @Override
                          public void onReceive(Context c, Intent i) {
                              String a = i.getAction();
                              if (BluetoothDevice.ACTION_FOUND.equals(a)) {
                                  BluetoothDevice d = i.getParcelableExtra(BluetoothDevice.EXTRA_DEVICE);
                                  String nm = i.getStringExtra(BluetoothDevice.EXTRA_NAME);
                                  BluetoothClass bc = i.getParcelableExtra(BluetoothDevice.EXTRA_CLASS);
                                  if (d != null) emitFound(d, false, nm, bc);
                              } else if (BluetoothAdapter.ACTION_DISCOVERY_FINISHED.equals(a)) {
                                  notifyListeners("discoveryDone", new JSObject());
                              }
                          }
                      };
                      IntentFilter f = new IntentFilter();
                      f.addAction(BluetoothDevice.ACTION_FOUND);
                      f.addAction(BluetoothAdapter.ACTION_DISCOVERY_FINISHED);
                      getContext().registerReceiver(receiver, f);
                      if (adapter.isDiscovering()) adapter.cancelDiscovery();
                      if (adapter.startDiscovery()) call.resolve();
                      else call.reject("Could not start the search (is Location turned on?)");
                  } catch (Exception e) {
                      call.reject("discover failed: " + e.getMessage());
                  }
              }

              private void emitFound(BluetoothDevice d, boolean paired, String nameExtra, BluetoothClass cls) {
                  String n = nameExtra != null ? nameExtra : d.getName();
                  BluetoothClass bc = cls != null ? cls : d.getBluetoothClass();
                  JSObject o = new JSObject();
                  o.put("name", n == null ? "" : n);
                  o.put("address", d.getAddress());
                  o.put("paired", paired);
                  o.put("major", bc == null ? -1 : bc.getMajorDeviceClass());
                  notifyListeners("found", o);
              }

              @PluginMethod
              public void connect(PluginCall call) {
                  final String addr = call.getString("address");
                  if (addr == null) { call.reject("address required"); return; }
                  new Thread(() -> {
                      try {
                          if (adapter == null) adapter = BluetoothAdapter.getDefaultAdapter();
                          if (adapter.isDiscovering()) adapter.cancelDiscovery();
                          BluetoothDevice dev = adapter.getRemoteDevice(addr);
                          BluetoothSocket s = dev.createInsecureRfcommSocketToServiceRecord(APP_UUID);
                          s.connect();
                          attach(s, nextId++);
                          call.resolve();
                      } catch (Exception e) {
                          call.reject("connect failed: " + e.getMessage());
                      }
                  }).start();
              }

              private void attach(final BluetoothSocket s, final int id) throws IOException {
                  final Conn c = new Conn();
                  c.id = id;
                  c.sock = s;
                  c.out = s.getOutputStream();
                  final InputStream in = s.getInputStream();
                  conns.put(id, c);
                  JSObject o = new JSObject();
                  o.put("id", id);
                  notifyListeners("connected", o);
                  new Thread(() -> {
                      byte[] buf = new byte[1024];
                      try {
                          int n;
                          while ((n = in.read(buf)) > 0) {
                              JSObject d = new JSObject();
                              d.put("id", id);
                              d.put("data", new String(buf, 0, n, StandardCharsets.UTF_8));
                              notifyListeners("data", d);
                          }
                      } catch (IOException ignored) {}
                      conns.remove(id);
                      try { s.close(); } catch (IOException ignored) {}
                      JSObject cl = new JSObject();
                      cl.put("id", id);
                      notifyListeners("closed", cl);
                  }).start();
              }

              // id < 0 (or missing) = broadcast to every connection
              @PluginMethod
              public void send(PluginCall call) {
                  final String data = call.getString("data");
                  final int id = call.getInt("id", -1);
                  if (data == null || conns.isEmpty()) { call.reject("not connected"); return; }
                  final byte[] bytes = data.getBytes(StandardCharsets.UTF_8);
                  writer.execute(() -> {
                      if (id < 0) {
                          for (Conn c : conns.values()) write(c, bytes);
                      } else {
                          Conn c = conns.get(id);
                          if (c != null) write(c, bytes);
                      }
                      call.resolve();
                  });
              }

              private void write(Conn c, byte[] b) {
                  try {
                      c.out.write(b);
                      c.out.flush();
                  } catch (IOException e) {
                      try { c.sock.close(); } catch (IOException ignored) {}
                  }
              }

              @PluginMethod
              public void close(PluginCall call) { shutdown(); call.resolve(); }

              @Override
              protected void handleOnDestroy() { shutdown(); }

              private void closeServer() {
                  try { if (server != null) server.close(); } catch (IOException ignored) {}
                  server = null;
              }

              private void stopReceiver() {
                  if (receiver != null) {
                      try { getContext().unregisterReceiver(receiver); } catch (Exception ignored) {}
                      receiver = null;
                  }
              }

              private void shutdown() {
                  closeServer();
                  for (Conn c : conns.values()) {
                      try { c.sock.close(); } catch (IOException ignored) {}
                  }
                  conns.clear();
                  stopReceiver();
                  try { if (adapter != null && adapter.isDiscovering()) adapter.cancelDiscovery(); } catch (Exception ignored) {}
              }
          }
          EOF

      - name: Build APK (with Bluetooth)
        id: build_bt
        continue-on-error: true
        working-directory: android
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build-bt.log

      - name: Fallback build (without Bluetooth) if the Bluetooth build failed
        if: steps.build_bt.outcome == 'failure'
        working-directory: android
        run: |
          echo "::warning::The Bluetooth build failed, so this APK is built WITHOUT Bluetooth. Download the build-log artifact to see why."
          rm -f app/src/main/java/com/hollowhalls/game/BtPlugin.java
          cat > app/src/main/java/com/hollowhalls/game/MainActivity.java <<'EOF'
          package com.hollowhalls.game;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {}
          EOF
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          ls -la android/app/build/outputs/apk/debug/
          cp android/app/build/outputs/apk/debug/app-debug.apk HollowHalls.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HollowHalls-apk
          path: HollowHalls.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-bt.log
          if-no-files-found: ignore

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Hollow Halls build ${{ github.run_number }}
          body: "Bluetooth build: ${{ steps.build_bt.outcome }}"
          files: HollowHalls.apk
