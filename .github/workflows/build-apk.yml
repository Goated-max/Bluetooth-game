name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web assets (bundle Three.js so the APK works offline)
        run: |
          mkdir -p www
          cp index.html www/index.html
          if curl -fsSL "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" -o www/three.min.js; then
            sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js#three.min.js#' www/index.html
            echo "Three.js bundled locally."
          else
            echo "Could not download Three.js; the app will load it from the CDN instead."
            rm -f www/three.min.js
          fi

      - name: Create Capacitor Android project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npm install --legacy-peer-deps @yesprasoon/capacitor-bluetooth-communication@1.0.0
          npx cap init "Hollow Halls" com.hollowhalls.game --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Patch Android (landscape + fullscreen)
        run: |
          sed -i 's#<activity#<activity android:screenOrientation="sensorLandscape"#' android/app/src/main/AndroidManifest.xml
          sed -i 's#<style name="AppTheme.NoActionBar"[^>]*>#&\n        <item name="android:windowFullscreen">true</item>#' android/app/src/main/res/values/styles.xml

      - name: Add Bluetooth permissions
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk HollowHalls.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HollowHalls-apk
          path: HollowHalls.apk

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Hollow Halls build ${{ github.run_number }}
          files: HollowHalls.apk
